name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          dotnet restore Larik.Data.MongoDB.csproj
          dotnet restore tests/Larik.Data.MongoDB.Tests/Larik.Data.MongoDB.Tests.csproj

      - name: Test
        run: dotnet test tests/Larik.Data.MongoDB.Tests/Larik.Data.MongoDB.Tests.csproj -c Release --no-restore
